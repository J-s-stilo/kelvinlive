<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kelvin Live</title>
<style>
:root{--bg:#07080d;--panel:#121722;--panel2:#171d29;--line:#293141;--text:#f5f7ff;--muted:#8e99ad;--purple:#7557ff;--blue:#3d63ff;--green:#55e59b;--red:#ff5361;--radius:26px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100vh}button,input,textarea,select{font:inherit}button{color:inherit;border:0;cursor:pointer}.hidden{display:none!important}
.app{min-height:100vh;background:radial-gradient(circle at 70% 0,#1a1534 0,transparent 28%),radial-gradient(circle at 0 55%,#101b2a 0,transparent 24%),var(--bg)}
.top{height:86px;display:flex;align-items:center;gap:18px;padding:16px 24px;border-bottom:1px solid #161b25;position:sticky;top:0;z-index:20;background:rgba(7,8,13,.94);backdrop-filter:blur(16px)}
.menu{width:58px;height:58px;border-radius:18px;background:#141b26;border:1px solid #344052;display:grid;place-items:center;font-size:31px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:25px;letter-spacing:-.8px}.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#a14cff,#2f5fff 65%,#22c7ff);display:grid;place-items:center;box-shadow:0 8px 30px #4f37a655;font-weight:900}.top-spacer{flex:1}.credit{border:1px solid #4b3a99;background:#15132b;border-radius:20px;padding:12px 16px;color:#dcd6ff;font-weight:700}.iconbtn{font-size:25px;background:transparent;color:#a9b3c7;padding:10px}
main{max-width:1180px;margin:auto;padding:22px 22px 120px}.titlebar{display:flex;align-items:center;gap:14px;margin:4px 0 24px}.titlebar h1{font-size:29px;margin:0}.eyebrow{color:#8f78ff;font-weight:800;letter-spacing:2px;font-size:13px;text-transform:uppercase}.muted{color:var(--muted)}
.card{background:linear-gradient(145deg,#131a24,#111620);border:1px solid #28313f;border-radius:28px;padding:24px;box-shadow:0 18px 55px #0004}.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{min-height:180px}.stat h3{margin:0 0 28px;color:#9aa5b9;text-transform:uppercase;letter-spacing:1.4px;font-size:15px}.stat .big{font-size:52px;font-weight:750}.stat .sub{margin-top:22px;color:#9ba6b9;font-size:17px}.green{color:var(--green)}
.btn{padding:14px 22px;border-radius:18px;background:linear-gradient(100deg,#7651ff,#356cff);font-weight:800;box-shadow:0 10px 30px #4c43ff33}.btn.secondary{background:#1a2230;border:1px solid #3a4557;box-shadow:none}.btn.ghost{background:transparent;border:1px solid #394456;box-shadow:none}.btn.danger{background:#2b1720;border:1px solid #70333e}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.video{background:#030408;border:1px solid #313a48;border-radius:25px;overflow:hidden;aspect-ratio:16/9;position:relative}.video video{width:100%;height:100%;object-fit:cover;background:#020306}.video .overlay{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;align-items:end}.pill{padding:8px 12px;border-radius:99px;background:#111622cc;border:1px solid #343d4d;color:#dce2ef}.livepill{color:#ff7180}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:6px}
.feedpost{min-height:180px}.avatar{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#7557ff,#315cff);display:grid;place-items:center;font-weight:900}.postbox textarea{width:100%;min-height:130px;background:transparent;border:0;outline:0;color:var(--text);font-size:21px;resize:none}.postbox{padding-bottom:14px}.posttools{border-top:1px solid #292f3b;padding-top:16px}
.live-strip{display:flex;gap:12px;overflow:auto;padding:2px 0 10px}.live-user{min-width:220px;border:1px solid #7d3142;background:#19121a;border-radius:50px;padding:10px 16px;display:flex;gap:10px;align-items:center}.live-user .mini{width:42px;height:42px;border-radius:14px;background:#4d4df5;display:grid;place-items:center;font-weight:800}.discover{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.topic{display:inline-block;padding:10px 18px;border:1px solid #5543ae;border-radius:99px;background:#1c1740;color:#d5ccff;margin:4px}
.chart{height:240px;display:flex;align-items:end;gap:10px;padding:25px 8px 0}.bar{flex:1;background:linear-gradient(180deg,#9180ff,#5a49dc);border-radius:12px 12px 0 0;min-width:12px}.settings .field{margin-top:18px}.field label{display:block;color:#a2adbf;text-transform:uppercase;font-size:13px;font-weight:800;letter-spacing:1.3px;margin-bottom:9px}.field input,.field select{width:100%;padding:16px;border-radius:18px;border:1px solid #2d3747;background:#182130;color:#fff;outline:none}
.side{position:fixed;inset:0;z-index:50;background:#0009;display:none}.side.open{display:block}.drawer{width:min(340px,88vw);height:100%;background:#0b0e15;border-right:1px solid #2b3341;padding:22px;overflow:auto}.drawer .brand{margin:6px 0 30px}.navitem{display:flex;gap:14px;align-items:center;width:100%;padding:14px 12px;border-radius:14px;background:transparent;text-align:left;color:#aeb8c9;font-weight:700}.navitem.active,.navitem:hover{background:#19152e;color:#fff}.navitem span:first-child{width:25px;text-align:center}.divider{height:1px;background:#242b36;margin:16px 0}
.bottom{position:fixed;bottom:0;left:0;right:0;height:84px;z-index:30;background:rgba(8,10,16,.96);border-top:1px solid #1d2430;display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px)}.bottom button{background:none;color:#7f8ba0;font-size:12px;font-weight:700}.bottom .active{color:#c3b7ff}.create{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#8757ff,#315fff);font-size:31px;box-shadow:0 12px 35px #553dff66}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth{width:min(500px,100%)}.auth .card{margin-top:18px}.auth input{width:100%;padding:16px;border-radius:16px;border:1px solid #303a49;background:#182130;color:white;margin:7px 0 16px}.auth h1{font-size:35px}.auth-tabs{display:flex;gap:8px;margin-bottom:20px}.auth-tabs button{flex:1;padding:12px;border-radius:14px;background:#141a24;color:#98a4b7}.auth-tabs .on{background:#272047;color:#fff;border:1px solid #5945b7}
.airow{display:grid;grid-template-columns:1fr 1fr;gap:18px}.look{border:1px solid #30394a;border-radius:18px;padding:18px;background:#171e29}.look.selected{border-color:#7456ff;box-shadow:0 0 0 1px #7456ff44 inset}.ref{aspect-ratio:16/10;border-radius:18px;background:#0a0d13;border:1px dashed #4a5363;display:grid;place-items:center;text-align:center;padding:20px}.copy{font-family:ui-monospace,monospace;background:#0a0d13;border:1px solid #303846;border-radius:15px;padding:14px;overflow:auto}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:15px 10px;border-bottom:1px solid #29313d;text-align:left}.notice{padding:14px 16px;border-radius:16px;background:#18152b;border:1px solid #4938a1;color:#d7d0ff}
@media(max-width:760px){.top{padding:12px 14px;height:74px}.brand{font-size:21px}.brandmark{width:36px;height:36px}.top .iconbtn{display:none}main{padding:18px 14px 105px}.two,.three,.airow,.discover{grid-template-columns:1fr}.card{padding:20px;border-radius:23px}.titlebar h1{font-size:25px}.stat .big{font-size:46px}.video{aspect-ratio:4/3}.desktop-only{display:none}.bottom{height:78px}.bottom button{font-size:11px}.create{width:58px;height:58px}}
</style>
</head>
<body>
<div id="authView" class="authwrap">
 <div class="auth">
  <div class="brand"><div class="brandmark">K</div>Kelvin Live</div>
  <div class="card">
   <div class="auth-tabs"><button id="loginTab" class="on" onclick="setAuth('login')">Log in</button><button id="signupTab" onclick="setAuth('signup')">Create account</button></div>
   <h1 id="authTitle">Welcome back</h1><p class="muted" id="authText">Sign in to continue to Kelvin Live.</p>
   <label class="muted">Full name</label><input id="nameInput" class="hidden" placeholder="Your full name">
   <label class="muted">Email address</label><input id="emailInput" type="email" placeholder="you@example.com">
   <label class="muted">Password</label><input id="passwordInput" type="password" placeholder="Enter your password">
   <div class="row between"><label class="muted"><input type="checkbox" id="rememberInput"> Keep me signed in</label><button class="btn ghost" style="padding:9px 12px" onclick="toast('Password recovery will be connected to the Kelvin server.')">Forgot password?</button></div>
   <button class="btn" style="width:100%;margin-top:18px" onclick="login()" id="authSubmit">Continue</button>
   <p id="authStatus" class="muted" style="text-align:center;margin:15px 0 0">Ready</p>
  </div>
 </div>
</div>
<div id="app" class="app hidden">
<header class="top"><button class="menu" onclick="openDrawer()">☰</button><div class="brand"><div class="brandmark">K</div><span>Kelvin Live</span></div><div class="top-spacer"></div><button class="iconbtn">⌕</button><button class="iconbtn">▢</button><div class="credit">0 cr</div></header>
<div id="drawer" class="side" onclick="closeDrawer(event)"><aside class="drawer" onclick="event.stopPropagation()"><div class="brand"><div class="brandmark">K</div>Kelvin Live</div><nav id="nav"></nav><div class="divider"></div><button class="navitem" onclick="toast('Community links will be connected later.')">◉ Telegram</button><button class="navitem" onclick="toast('Community links will be connected later.')">◉ WhatsApp</button><div class="divider"></div><button class="navitem" onclick="logout()">↪ Log out</button></aside></div>
<main id="main"></main>
<nav class="bottom"><button onclick="page('home')" id="bHome">⌂<br>Home</button><button onclick="page('discover')" id="bDiscover">⌕<br>Discover</button><button class="create" onclick="page('create')">+</button><button onclick="page('live')" id="bLive">●<br>Live</button><button onclick="page('profile')" id="bProfile">♙<br>Profile</button></nav>
</div>
<div id="toast" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:100;background:#202736;border:1px solid #3a4558;padding:13px 17px;border-radius:15px;display:none"></div>
<script>
const state={auth:'login',page:'home',stream:null,recorder:null,recorded:[],live:false,startedAt:null,viewers:0,resolution:'1080p',fps:'30 FPS',bitrate:'6000 kbps',ai:false,reference:null};
const navItems=[['home','⌂','Home'],['studio','▣','Studio'],['feed','◉','Feed'],['aiobs','✦','AI & OBS'],['analytics','▥','Analytics'],['credits','◈','Credits'],['transactions','▤','Transactions'],['tutorial','▶','Tutorial'],['settings','⚙','Settings']];
function $(id){return document.getElementById(id)}function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2600)}
function setAuth(mode){state.auth=mode;let s=mode==='signup';$('loginTab').classList.toggle('on',!s);$('signupTab').classList.toggle('on',s);$('authTitle').textContent=s?'Create your account':'Welcome back';$('authText').textContent=s?'Create an account to start using Kelvin Live.':'Sign in to continue to Kelvin Live.';$('nameInput').classList.toggle('hidden',!s);$('authSubmit').textContent=s?'Create account':'Continue'}
async function login(){let email=$('emailInput').value.trim(),pass=$('passwordInput').value,name=$('nameInput').value.trim();if(!email||!email.includes('@')||pass.length<6){$('authStatus').textContent='Enter a valid email and a password of at least 6 characters.';return}localStorage.kelvinUserEmail=email;localStorage.kelvinUserName=name||email.split('@')[0];localStorage.kelvinLoggedIn='1';$('authView').classList.add('hidden');$('app').classList.remove('hidden');page('home');toast(state.auth==='signup'?'Account created':'Welcome back')}
function logout(){localStorage.removeItem('kelvinLoggedIn');location.reload()}
function openDrawer(){renderNav();$('drawer').classList.add('open')}function closeDrawer(e){if(e.target.id==='drawer')$('drawer').classList.remove('open')}
function renderNav(){ $('nav').innerHTML=navItems.map(([id,ic,t])=>`<button class="navitem ${state.page===id?'active':''}" onclick="page('${id}');closeDrawer({target:{id:'drawer'}})"><span>${ic}</span><span>${t}</span></button>`).join('')}
function page(p){state.page=p;renderNav();$('drawer').classList.remove('open');render();window.scrollTo(0,0);['home','discover','live','profile'].forEach(x=>{let b=$('b'+x[0].toUpperCase()+x.slice(1));if(b)b.classList.toggle('active',p===x)})}
function render(){let m=$('main');let p=state.page;if(p==='home')m.innerHTML=home();else if(p==='discover')m.innerHTML=discover();else if(p==='create')m.innerHTML=create();else if(p==='live')m.innerHTML=live();else if(p==='profile')m.innerHTML=profile();else if(p==='studio')m.innerHTML=studio();else if(p==='feed')m.innerHTML=feed();else if(p==='aiobs')m.innerHTML=aiobs();else if(p==='analytics')m.innerHTML=analytics();else if(p==='credits')m.innerHTML=credits();else if(p==='transactions')m.innerHTML=transactions();else if(p==='tutorial')m.innerHTML=tutorial();else if(p==='settings')m.innerHTML=settings()}
function head(t,ey=''){return `<div class="titlebar"><div><div class="eyebrow">${ey}</div><h1>${t}</h1></div></div>`}
function home(){return `<div class="live-strip">${['danieljerome196','otfbartist','agentkayla19'].map((x,i)=>`<div class="live-user"><span class="mini">${x[0].toUpperCase()}</span><div><b><span class="dot livepill">●</span> LIVE</b><br>@${x}</div></div>`).join('')}</div><div class="card postbox"><div class="row"><div class="avatar">${(localStorage.kelvinUserName||'K')[0].toUpperCase()}</div><h2 style="font-weight:500;color:#7f8ca3">What's on your mind?</h2></div><textarea maxlength="500" placeholder="Share something with your audience..."></textarea><div class="posttools row between"><div class="row"><span class="pill">😊 Emoji</span><span class="pill">🌐 Everyone</span></div><button class="btn">Post</button></div></div><section style="margin-top:25px"><h3 class="muted">TRENDING TOPICS</h3><div>${['#AI','#Tech','#Creators','#Music'].map(x=>`<span class="topic">${x}</span>`).join('')}</div></section><div class="grid" style="margin-top:22px">${['agentkayla19','techwithsam','kelvincreator'].map((x,i)=>`<div class="card feedpost"><div class="row"><div class="avatar">${x[0].toUpperCase()}</div><div><b>${x}</b><div class="muted">@${x}</div></div><div class="top-spacer">•••</div></div><p style="font-size:18px">Building something live today. Come join the stream.</p><div class="muted">${i+1}h · 🌐 Everyone</div></div>`).join('')}</div>`}
function discover(){return head('Discover','EXPLORE')+`<div class="card"><h2>Live now</h2><div class="discover">${['Daniel Jerome','OTF Artist','Agent Kayla','Tech Studio','Creator Hub','Music Live'].map((x,i)=>`<div class="card"><div class="video" style="aspect-ratio:16/11"><div class="overlay"><span class="pill livepill">● LIVE</span><span class="pill">${120+i*73} viewers</span></div></div><h3>${x}</h3><button class="btn" onclick="page('live')">Watch</button></div>`).join('')}</div></div>`}
function create(){return head('Create','CREATE')+`<div class="grid two"><div class="card"><h2>Go live</h2><p class="muted">Open the creator studio, choose your camera and start a live stream.</p><button class="btn" onclick="page('studio')">Open Studio</button></div><div class="card"><h2>Create a post</h2><p class="muted">Share text, topics and updates with your audience.</p><button class="btn secondary" onclick="page('home')">Create post</button></div><div class="card"><h2>AI & OBS</h2><p class="muted">Prepare your AI output and secure browser source.</p><button class="btn secondary" onclick="page('aiobs')">Open AI & OBS</button></div></div>`}
function live(){return head('Live','BROADCAST')+`<div class="card"><div class="video" id="liveVideo"><div class="overlay"><span class="pill ${state.live?'livepill':''}"><span class="dot">●</span>${state.live?'LIVE':'OFFLINE'}</span><span class="pill">${state.viewers} viewers</span></div></div><div class="row between" style="margin-top:18px"><div><h2>${state.live?'Kelvin Live is broadcasting':'Watch live creators'}</h2><p class="muted">${state.live?'Your stream is active.':'Choose a creator from Discover or start your own stream.'}</p></div><button class="btn" onclick="page('studio')">${state.live?'Manage stream':'Go Live'}</button></div></div><div class="card" style="margin-top:18px"><h2>Live chat</h2><div class="muted">Chat will appear here when a live session is connected.</div></div>`}
function profile(){let n=localStorage.kelvinUserName||'Kelvin User',e=localStorage.kelvinUserEmail||'';return head('Profile','ACCOUNT')+`<div class="card"><div class="row"><div class="avatar" style="width:72px;height:72px;font-size:28px">${n[0].toUpperCase()}</div><div><h2>${n}</h2><p class="muted">@${n.replace(/\s+/g,'').toLowerCase()}</p><p class="muted">${e}</p></div></div><div class="grid three" style="margin-top:25px"><div><b>0</b><div class="muted">Followers</div></div><div><b>0</b><div class="muted">Following</div></div><div><b>0</b><div class="muted">Streams</div></div></div></div>`}
function studio(){return head('Studio','CREATOR STUDIO')+`<div class="card"><div class="row between"><div><h2>Go live. Get watched. Chat in real time.</h2><p class="muted">Camera preview, natural mode, AI mode and broadcast controls.</p></div><span class="pill ${state.live?'livepill':''}">● ${state.live?'LIVE':'OFFLINE'}</span></div><div class="video" style="margin-top:18px"><video id="studioVideo" autoplay muted playsinline></video><div class="overlay"><div class="row"><span class="pill">${state.ai?'AI MODE':'REAL CAMERA'}</span><span class="pill">${state.resolution}</span></div><span class="pill">${state.live?'Live':'Preview'}</span></div></div><div class="row" style="margin-top:16px"><button class="btn" onclick="toggleLive()">${state.live?'Stop Live':'Go Live'}</button><button class="btn secondary" onclick="startCamera()">Camera</button><button class="btn secondary" onclick="stopCamera()">Mic</button><button class="btn secondary" onclick="flipCamera()">Switch camera</button><select class="btn secondary" onchange="state.resolution=this.value;render()"><option>1080p</option><option>720p</option></select></div></div><div class="grid two" style="margin-top:18px"><div class="card"><h2>Audience</h2><p class="muted">Everyone</p><div class="notice">Live viewers: ${state.viewers}</div></div><div class="card"><h2>AI look</h2><div class="look ${!state.ai?'selected':''}" onclick="state.ai=false;render();startCamera()"><b>Natural</b><p class="muted">Real camera — no AI processing.</p></div><div class="look ${state.ai?'selected':''}" onclick="state.ai=true;render();startCamera()"><b>AI mode</b><p class="muted">Realtime transformation will be connected to the GPU engine.</p></div></div></div><div class="card" style="margin-top:18px"><h2>Recording</h2><p class="muted">Record the camera output locally while streaming.</p><button class="btn secondary" onclick="toggleRecord()">${state.recorder?'Stop recording':'Start recording'}</button></div>`}
function feed(){return head('Feed','LIVE NOW')+`<div class="grid two">${['danieljerome196','otfbartist','agentkayla19','kelvincreator'].map((x,i)=>`<div class="card"><div class="video"><div class="overlay"><span class="pill livepill">● LIVE</span><span class="pill">${240+i*41} viewers</span></div></div><div class="row" style="margin-top:14px"><div class="avatar">${x[0].toUpperCase()}</div><div><b>${x}</b><div class="muted">AI Creator</div></div><div class="top-spacer"></div><button class="btn" onclick="page('live')">Watch</button></div></div>`).join('')}</div>`}
function aiobs(){return head('AI & OBS','AI PROGRAM OUTPUT')+`<div class="card"><div class="row between"><div><h2>AI program output</h2><p class="muted">Realtime AI streaming output for OBS, Zoom or Meet.</p></div><button class="btn" onclick="state.ai=true;page('studio')">Start Streaming</button></div><div class="airow" style="margin-top:20px"><div><h3>Camera input</h3><div class="video"><video id="aiVideo" autoplay muted playsinline></video></div><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="startCamera()">Camera</button><button class="btn secondary">Mic</button></div></div><div><h3>Background / Choose your look</h3><div class="look selected"><b>Default reference image</b><p class="muted">Kelvin Live AI look</p></div><div class="ref" style="margin-top:12px"><input type="file" accept="image/*" onchange="loadReference(this)"></div></div></div></div><div class="card" style="margin-top:18px"><h2>AI settings</h2><div class="grid three"><div class="field"><label>Resolution</label><select><option>1080p</option><option>720p</option></select></div><div class="field"><label>Frame rate</label><select><option>30 FPS</option><option>24 FPS</option></select></div><div class="field"><label>Mode</label><select><option>Realtime AI</option><option>Natural</option></select></div></div><p class="muted">AI credits will be consumed only while the GPU output is generating.</p></div><div class="card" style="margin-top:18px"><h2>OBS Browser Source</h2><p class="muted">Private URL for your Kelvin Live output.</p><div class="copy" id="obsUrl">https://kelvinlive.example/obs?token=klv_demo_private_token</div><div class="row" style="margin-top:14px"><button class="btn" onclick="navigator.clipboard?.writeText($('obsUrl').textContent);toast('URL copied')">Copy URL</button><button class="btn secondary" onclick="toast('Preview endpoint will open after the streaming server is connected.')">Open preview</button><button class="btn secondary">Regenerate URL</button></div><h3 style="margin-top:28px">OBS setup</h3><ol class="muted"><li>Open OBS Studio.</li><li>Add a Browser Source.</li><li>Paste the private Kelvin Live URL.</li><li>Set the output size to 1920 × 1080.</li><li>Start your broadcast.</li></ol></div>`}
function analytics(){return head('Analytics','CREATOR ANALYTICS')+`<div class="grid two"><div class="card stat"><h3>Live viewers</h3><div class="big">${state.viewers}</div><div class="sub">${state.live?'Live now':'Offline'}</div></div><div class="card stat"><h3>Stream time (today)</h3><div class="big">${state.live?'0:01':'0:00'}</div><div class="sub">This session</div></div><div class="card stat"><h3>Followers</h3><div class="big">0</div><div class="sub green">+0 this week</div></div><div class="card stat"><h3>AI usage</h3><div class="big">${state.ai?'0%':'0%'}</div><div class="sub">of stream time</div></div></div><div class="card" style="margin-top:18px"><div class="row between"><h2>Credits left</h2><span class="pill">0 cr</span></div><h2 style="font-size:42px">0</h2><div class="muted">Available</div></div><div class="card" style="margin-top:18px"><h2>Viewers over time</h2><div class="chart">${[20,28,42,31,52,65,48,75,90,80,100,88].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></div><div class="card" style="margin-top:18px"><h2>AI usage (last 12 streams)</h2><div class="chart">${[30,48,37,57,67,51,73,61,80,69,59,86].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></div>`}
function credits(){return head('Credits','USAGE')+`<div class="card"><div class="eyebrow">Credits remaining</div><div class="big" style="font-size:60px">0</div><p class="muted">Available</p><div class="grid three" style="margin-top:20px"><div class="look"><b>Starter</b><p class="muted">Credits package</p><button class="btn secondary" onclick="toast('Payment will be connected later.')">Buy credits</button></div><div class="look"><b>Creator</b><p class="muted">More AI runtime</p><button class="btn secondary">Buy credits</button></div><div class="look"><b>Pro</b><p class="muted">High-volume streaming</p><button class="btn secondary">Buy credits</button></div></div></div>`}
function transactions(){return head('Transactions','ACCOUNT')+`<div class="card"><div class="row between"><h2>Transactions</h2><span class="pill">manual_transfer</span></div><table class="table"><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr><tr><td>—</td><td>No transactions</td><td>—</td><td>—</td></tr></table></div>`}
function tutorial(){return head('Tutorial','LEARN')+`<div class="grid two">${[['1','Start camera','Allow camera and microphone access in your browser.'],['2','Choose a look','Use Natural mode or connect the realtime AI engine.'],['3','Go Live','Start the broadcast and monitor viewers/chat.'],['4','Use OBS','Copy the private Browser Source URL into OBS.'],['5','Monitor analytics','Review viewers, stream time and AI usage.'],['6','Stay authorized','Only use reference images and likenesses you have rights to use.']].map(x=>`<div class="card"><div class="eyebrow">STEP ${x[0]}</div><h2>${x[1]}</h2><p class="muted">${x[2]}</p></div>`).join('')}</div>`}
function settings(){return head('Settings','PREFERENCES')+`<div class="card"><h2>Settings</h2><p class="muted">Manage your stream quality, devices, account details, and security — all in one place.</p><div class="card" style="margin-top:18px"><div class="row"><div class="avatar">${(localStorage.kelvinUserName||'K')[0].toUpperCase()}</div><div><h3>${localStorage.kelvinUserEmail||'Kelvin User'}</h3><p class="muted">Standard account</p></div></div></div></div><div class="card settings" style="margin-top:18px"><h2>Stream & devices</h2><p class="muted">Output quality and input controls</p><div class="grid three"><div class="field"><label>Resolution</label><select onchange="state.resolution=this.value"><option>1080p</option><option>720p</option></select></div><div class="field"><label>Frame rate</label><select onchange="state.fps=this.value"><option>30 FPS</option><option>24 FPS</option></select></div><div class="field"><label>Bitrate</label><select onchange="state.bitrate=this.value"><option>6000 kbps</option><option>4500 kbps</option><option>2500 kbps</option></select></div></div></div><div class="card" style="margin-top:18px"><h2>Credits & payment</h2><div class="row between"><span class="muted">Credits remaining</span><b>0</b></div><div class="row between" style="margin-top:18px"><span class="muted">Payment gateway</span><b>manual_transfer</b></div><div class="row" style="margin-top:18px"><button class="btn" onclick="page('credits')">Buy credits</button><button class="btn secondary" onclick="page('transactions')">View transactions</button></div></div><div class="card" style="margin-top:18px"><h2>Security</h2><p class="muted">Update your password</p><div class="field"><label>Current password</label><input placeholder="Enter current password"></div><div class="field"><label>New password</label><input placeholder="Min. 6 characters" type="password"></div><div class="field"><label>Confirm password</label><input placeholder="Repeat new password" type="password"></div><button class="btn" style="margin-top:18px">Change password</button></div>`}
async function startCamera(){try{if(state.stream)state.stream.getTracks().forEach(t=>t.stop());state.stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080},facingMode:'user'},audio:true});['studioVideo','aiVideo','liveVideo'].forEach(id=>{let v=$(id);if(v)v.srcObject=state.stream});toast(state.ai?'AI input ready — GPU transform will attach here.':'Camera ready')}catch(e){toast(e.message||'Camera permission required')}}
function stopCamera(){if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}toast('Camera stopped')}
function flipCamera(){toast('Camera switching will use the device camera selector in the streaming server.')}
function toggleLive(){if(state.live){state.live=false;state.viewers=0;stopCamera();toast('Stream stopped')}else{state.live=true;state.viewers=1;startCamera();toast('Live session started')};render()}
function toggleRecord(){if(!state.stream){startCamera();return}if(state.recorder){state.recorder.stop();return}try{state.recorded=[];state.recorder=new MediaRecorder(state.stream);state.recorder.ondataavailable=e=>e.data.size&&state.recorded.push(e.data);state.recorder.onstop=()=>{let b=new Blob(state.recorded,{type:'video/webm'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='kelvin-live-recording.webm';a.click();state.recorder=null;toast('Recording saved')};state.recorder.start();toast('Recording started')}catch(e){toast('Recording is not supported in this browser')}}
function loadReference(input){let f=input.files?.[0];if(!f)return;state.reference=f.name;toast('Reference selected: '+f.name)}
if(localStorage.kelvinLoggedIn){$('authView').classList.add('hidden');$('app').classList.remove('hidden');page('home')}else{setAuth('login')}
</script>
